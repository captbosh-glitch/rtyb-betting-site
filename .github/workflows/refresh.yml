name: Refresh RTYB data and publish

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort and can lag a few
    # minutes under load, especially right at the top of the hour -- that's
    # normal, not a sign anything's broken.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'base_data.json'
      - 'template.html'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: rtyb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch NHL schedule and scores
        run: python3 scripts/fetch_schedule.py

      - name: Fetch 1P moneyline / totals odds (The Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds_theoddsapi.py

      - name: Fetch 1P BTTS odds (SportsGameOdds)
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python3 scripts/fetch_odds_sportsgameodds.py

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "rtyb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html schedule_data.json
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "Auto-refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
          # Pages is set to "Deploy from a branch" (main / root) in repo
          # settings -- see README -- so pushing index.html here is what
          # actually publishes it. No separate deploy step needed.
