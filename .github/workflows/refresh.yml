name: Refresh RTYB data and publish

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort and can lag a few
    # minutes under load, especially right at the top of the hour -- that's
    # normal, not a sign anything's broken.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'base_data.json'
      - 'template.html'
      - 'scripts/**'
      # Admin Save (Matchups or Results Tool) publishes to these -- rebuild
      # right away so every record (Games, Stats, Teams, team pages) reflects it.
      - 'data_admin/odds_overrides.json'
      - 'data_admin/results_overrides.json'

permissions:
  contents: write

concurrency:
  group: rtyb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch NHL schedule and scores
        run: python3 scripts/fetch_schedule.py

      - name: Fetch team logos (cached, idempotent -- no API key needed)
        run: python3 scripts/fetch_team_logos.py

      - name: Decide whether this run also fetches odds
        id: gate
        run: |
          # Odds cost API quota (both providers' free tiers are limited);
          # scores/schedule don't (the NHL API is free and unlimited). So
          # scores refresh every 10 minutes, but odds only refresh once an
          # hour -- specifically on the run landing in the first 10 minutes
          # after the hour. Force it with workflow_dispatch when you want an
          # odds refresh on demand.
          minute=$(date -u +%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$minute" -lt 10 ]; then
            echo "fetch_odds=true" >> "$GITHUB_OUTPUT"
          else
            echo "fetch_odds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch 1P moneyline / totals odds (The Odds API)
        if: steps.gate.outputs.fetch_odds == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds_theoddsapi.py

      - name: Fetch 1P BTTS odds (SportsGameOdds)
        if: steps.gate.outputs.fetch_odds == 'true'
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python3 scripts/fetch_odds_sportsgameodds.py

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "rtyb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html nhl schedule_data.json assets/logos
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
            exit 0
          fi
          git commit -m "Auto-refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Someone pushing locally at the same moment (e.g. a manual file
          # update) can land on the remote between this commit and the push
          # below, which would otherwise fail with a plain rejection. Retry a
          # few times, rebasing onto whatever's newly on the remote each
          # time, instead of just failing the whole run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt) -- rebasing onto latest remote and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          # Pages is set to "Deploy from a branch" (main / root) in repo
          # settings -- see README -- so pushing index.html here is what
          # actually publishes it. No separate deploy step needed.
